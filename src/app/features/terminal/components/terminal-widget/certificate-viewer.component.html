<div class="certificate-viewer-container flex flex-col h-full bg-[#1A1333] border border-[#DDD6FE]/10 rounded-xl p-3.5 sm:p-6 select-text text-white">
  <!-- Header -->
  <div class="flex flex-wrap items-center justify-between gap-2 border-b border-[#DDD6FE]/10 pb-3 mb-4 flex-shrink-0 select-none">
    <h3 class="text-base sm:text-xl font-extrabold text-[#38BDF8] tracking-tight font-sans break-words max-w-full">
      {{ certificate?.title }}
    </h3>
    <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold font-mono border border-purple-500/20 bg-purple-500/10 text-purple-300 flex-shrink-0">
      Technical Certification
    </span>
  </div>

  <!-- Certificate Image / Fallback -->
  <div class="certificate-image-wrapper relative mb-4 overflow-hidden rounded-lg border border-[#DDD6FE]/10 bg-[#120b24] flex-shrink-0 w-full">
    <img
      *ngIf="certificate?.imageUrl && !imageFailed"
      [src]="certificate?.imageUrl"
      (error)="onImageError()"
      [alt]="certificate?.title || 'Certificate preview'"
      class="certificate-image"
    />
    <div *ngIf="!certificate?.imageUrl || imageFailed" class="flex flex-col items-center justify-center w-full h-full min-h-[180px] bg-gradient-to-br from-[#241744] to-[#120a24] text-zinc-400 p-4 text-center select-none">
      <svg class="w-8 h-8 mb-2 opacity-40 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <span class="text-xs font-mono text-zinc-300 font-medium">CERTIFICATE PREVIEW</span>
      <span class="text-[10px] font-mono text-purple-300/60 uppercase mt-0.5">{{ certificate?.title }}</span>
    </div>
  </div>

  <!-- Info -->
  <div class="mb-4">
    <h4 class="text-xs font-mono uppercase tracking-wider text-zinc-500 mb-1.5 select-none">Document Info</h4>
    <p class="text-sm text-zinc-300 leading-relaxed font-sans">{{ certificate?.title }} — Technical Certification</p>
  </div>

  <!-- Navigation Footer -->
  <div class="flex items-center justify-between gap-2 border-t border-[#DDD6FE]/10 pt-3.5 mt-auto flex-shrink-0 select-none">
    <button (click)="onPrev.emit()" class="flex-1 sm:flex-initial px-3 sm:px-4 py-2 rounded bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 font-mono text-xs sm:text-sm transition-colors cursor-pointer text-center">
      [ Previous ]
    </button>
    <button (click)="onNext.emit()" class="flex-1 sm:flex-initial px-3 sm:px-4 py-2 rounded bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 font-mono text-xs sm:text-sm transition-colors cursor-pointer text-center">
      [ Next ]
    </button>
  </div>
</div>
