<div class="project-viewer-container flex flex-col h-full bg-[#1A1333] border border-[#DDD6FE]/10 rounded-xl p-6 select-text text-white">
  <!-- Header -->
  <div class="flex items-center justify-between border-b border-[#DDD6FE]/10 pb-4 mb-4 select-none">
    <h3 class="text-xl font-extrabold text-[#38BDF8] tracking-tight font-sans">
      {{ project?.title }}
    </h3>
    <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold font-mono border" [ngClass]="statusClass">
      {{ project?.status }}
    </span>
  </div>

  <!-- Description -->
  <div class="flex-grow mb-6">
    <h4 class="text-xs font-mono uppercase tracking-wider text-zinc-500 mb-2 select-none">Description</h4>
    <p class="text-sm text-zinc-300 leading-relaxed font-sans">{{ project?.description }}</p>
  </div>

  <!-- Tech Stack -->
  <div class="mb-6">
    <h4 class="text-xs font-mono uppercase tracking-wider text-zinc-500 mb-2 select-none">Tech Stack</h4>
    <div class="flex flex-wrap gap-2">
      <span *ngFor="let tech of project?.techStack" class="px-2.5 py-1 rounded bg-[#2a1f4a] text-xs font-mono text-[#C4B5FD] border border-[#DDD6FE]/5">
        {{ tech }}
      </span>
    </div>
  </div>

  <!-- Links -->
  <div class="flex gap-4 mb-6">
    <a *ngIf="project?.gitUrl" [href]="project?.gitUrl" target="_blank" rel="noopener noreferrer" 
       class="flex items-center gap-1.5 px-4 py-2 rounded-lg bg-[#2a1f4a] hover:bg-[#34275c] border border-[#DDD6FE]/10 text-sm font-mono text-[#C4B5FD] transition-colors select-none">
      <span>GitHub</span>
    </a>
    <a *ngIf="project?.liveUrl" [href]="project?.liveUrl" target="_blank" rel="noopener noreferrer" 
       class="flex items-center gap-1.5 px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-mono text-white transition-colors select-none">
      <span>Live Demo</span>
    </a>
  </div>

  <!-- Navigation Footer -->
  <div class="flex items-center justify-between border-t border-[#DDD6FE]/10 pt-4 mt-auto select-none">
    <button (click)="onPrev.emit()" class="px-4 py-2 rounded bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 font-mono text-sm transition-colors cursor-pointer">
      [ Previous ]
    </button>
    <button (click)="onNext.emit()" class="px-4 py-2 rounded bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 font-mono text-sm transition-colors cursor-pointer">
      [ Next ]
    </button>
  </div>
</div>
