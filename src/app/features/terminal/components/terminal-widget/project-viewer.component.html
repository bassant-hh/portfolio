<div class="project-viewer-container flex flex-col h-full bg-[#1A1333] border border-[#DDD6FE]/10 rounded-xl p-3.5 sm:p-6 select-text text-white">
  <!-- Header -->
  <div class="flex flex-wrap items-center justify-between gap-2 border-b border-[#DDD6FE]/10 pb-3 mb-4 flex-shrink-0 select-none">
    <h3 class="text-base sm:text-xl font-extrabold text-[#38BDF8] tracking-tight font-sans break-words max-w-full">
      {{ project?.title }}
    </h3>
    <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold font-mono border flex-shrink-0" [ngClass]="statusClass">
      {{ project?.status }}
    </span>
  </div>

  <!-- Project Image / Fallback -->
  <div class="project-image-wrapper mb-4">
    <img
      *ngIf="project?.imageUrl && !imageFailed"
      [src]="project?.imageUrl"
      (error)="onImageError()"
      [alt]="project?.title || 'Project preview'"
    />
    <div *ngIf="!project?.imageUrl || imageFailed" class="flex flex-col items-center justify-center w-full h-full bg-gradient-to-br from-[#241744] to-[#120a24] text-zinc-400 p-4 text-center select-none">
      <svg class="w-7 h-7 sm:w-8 sm:h-8 mb-2 opacity-40 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
      </svg>
      <span class="text-xs font-mono text-zinc-300 font-medium">CONSOLE INTERFACE</span>
      <span class="text-[10px] font-mono text-purple-300/60 uppercase mt-0.5">{{ project?.category }}</span>
    </div>
  </div>

  <!-- Description -->
  <div class="mb-4">
    <h4 class="text-xs font-mono uppercase tracking-wider text-zinc-500 mb-1.5 select-none">Description</h4>
    <p class="text-sm text-zinc-300 leading-relaxed font-sans">{{ project?.description }}</p>
  </div>

  <!-- Tech Stack -->
  <div class="mb-4">
    <h4 class="text-xs font-mono uppercase tracking-wider text-zinc-500 mb-1.5 select-none">Tech Stack</h4>
    <div class="flex flex-wrap gap-2">
      <span *ngFor="let tech of project?.techStack" class="px-2.5 py-1 rounded bg-[#2a1f4a] text-xs font-mono text-[#C4B5FD] border border-[#DDD6FE]/5 break-all">
        {{ tech }}
      </span>
    </div>
  </div>

  <!-- Links -->
  <div class="flex flex-wrap gap-3 mb-4" *ngIf="project?.gitUrl || project?.liveUrl">
    <a *ngIf="project?.gitUrl" [href]="project?.gitUrl" target="_blank" rel="noopener noreferrer"
       class="flex items-center gap-1.5 px-4 py-2 rounded-lg bg-[#2a1f4a] hover:bg-[#34275c] border border-[#DDD6FE]/10 text-sm font-mono text-[#C4B5FD] transition-colors select-none">
      <span>GitHub</span>
    </a>
    <a *ngIf="project?.liveUrl" [href]="project?.liveUrl" target="_blank" rel="noopener noreferrer"
       class="flex items-center gap-1.5 px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-mono text-white transition-colors select-none">
      <span>Live Demo</span>
    </a>
  </div>

  <!-- Navigation Footer -->
  <div class="flex items-center justify-between gap-2 border-t border-[#DDD6FE]/10 pt-3.5 mt-auto flex-shrink-0 select-none">
    <button (click)="onPrev.emit()" class="flex-1 sm:flex-initial px-3 sm:px-4 py-2 rounded bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 font-mono text-xs sm:text-sm transition-colors cursor-pointer text-center">
      [ Previous ]
    </button>
    <button (click)="onNext.emit()" class="flex-1 sm:flex-initial px-3 sm:px-4 py-2 rounded bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 font-mono text-xs sm:text-sm transition-colors cursor-pointer text-center">
      [ Next ]
    </button>
  </div>
</div>
