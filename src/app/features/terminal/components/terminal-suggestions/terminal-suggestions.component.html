<div class="flex items-center gap-2 px-4 py-2 border-b border-zinc-900/50 bg-zinc-950/50 overflow-x-auto select-none no-scrollbar">
  <span class="text-[9px] font-mono font-bold tracking-wider text-zinc-500 uppercase mr-1 whitespace-nowrap">Suggestions:</span>
  <button (click)="selectSuggestion('help')" class="px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 font-mono text-[10px] transition-colors whitespace-nowrap" type="button">
    help
  </button>
  <button (click)="selectSuggestion('about')" class="px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 font-mono text-[10px] transition-colors whitespace-nowrap" type="button">
    about
  </button>
  <button (click)="selectSuggestion('projects')" class="px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 font-mono text-[10px] transition-colors whitespace-nowrap" type="button">
    projects
  </button>
  <button (click)="selectSuggestion('skills')" class="px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 font-mono text-[10px] transition-colors whitespace-nowrap" type="button">
    skills
  </button>
  <button (click)="selectSuggestion('inspect rag-book-assistant')" class="px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-indigo-400 hover:border-indigo-500/30 font-mono text-[10px] transition-colors whitespace-nowrap" type="button">
    inspect rag-book-assistant
  </button>
  <button (click)="selectSuggestion('inspect analytics-dashboard')" class="px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-indigo-400 hover:border-indigo-500/30 font-mono text-[10px] transition-colors whitespace-nowrap" type="button">
    inspect analytics-dashboard
  </button>
  <button (click)="selectSuggestion('inspect search-indexer')" class="px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-indigo-400 hover:border-indigo-500/30 font-mono text-[10px] transition-colors whitespace-nowrap" type="button">
    inspect search-indexer
  </button>
  <button (click)="selectSuggestion('clear')" class="px-2 py-0.5 rounded bg-zinc-900 border border-zinc-800 text-zinc-500 hover:text-red-400 hover:border-red-950 font-mono text-[10px] transition-colors whitespace-nowrap" type="button">
    clear
  </button>
</div>
