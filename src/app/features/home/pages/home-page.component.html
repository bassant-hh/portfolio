<!-- Hero Section -->
<section class="flex-shrink-0 flex items-center justify-center relative overflow-hidden py-10 sm:py-16 lg:py-20 px-4 sm:px-6 lg:px-8 border-b border-[var(--border-soft)]">
  <!-- Purple glow effect backdrop -->
  <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
    <div class="w-[300px] sm:w-[500px] h-[300px] sm:h-[500px] bg-purple-500/10 rounded-full blur-[90px] sm:blur-[120px] absolute translate-y-[-10%]"></div>
    <div class="w-[200px] sm:w-[300px] h-[200px] sm:h-[300px] bg-violet-400/10 rounded-full blur-[70px] sm:blur-[100px] absolute translate-x-[20%] translate-y-[10%]"></div>
  </div>

  <div class="relative z-10 max-w-4xl mx-auto text-center">
    <!-- Onboarding / Availability Badge -->
    <span class="inline-flex items-center gap-1.5 px-3 sm:px-3.5 py-1 sm:py-1.5 rounded-full text-[11px] sm:text-xs font-semibold bg-[var(--very-light)] text-[var(--primary-deep)] border border-[var(--border)] mb-4 sm:mb-6 select-none shadow-xs">
      <span class="h-2 w-2 rounded-full bg-[var(--primary)] animate-pulse"></span>
      {{ data.availabilityText }}
    </span>

    <!-- Main Title & Role -->
    <h1 class="text-3xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight text-[var(--text)] mb-3 sm:mb-4">
      {{ data.name }}
    </h1>
    <h2 class="text-lg sm:text-2xl lg:text-3xl font-bold bg-gradient-to-r from-[var(--primary-dark)] via-[var(--primary)] to-[var(--primary-deep)] bg-clip-text text-transparent mb-4 sm:mb-6">
      {{ data.role }}
    </h2>

    <!-- Introduction -->
    <p class="max-w-2xl mx-auto text-sm sm:text-base lg:text-lg text-[var(--text-secondary)] leading-relaxed mb-6 sm:mb-8">
      {{ data.introduction }}
    </p>

    <!-- CTA Buttons -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4 w-full sm:w-auto">
      <app-button variant="primary" size="lg" [routerLink]="['/projects']" customClass="w-full sm:w-auto shadow-md shadow-purple-500/15">
        View Projects
        <svg class="h-4 w-4 ml-2" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
        </svg>
      </app-button>
      
      <app-button variant="secondary" size="lg" [routerLink]="['/contact']" customClass="w-full sm:w-auto">
        Contact Me
      </app-button>
    </div>
  </div>
</section>



<!-- Composed Business Sections -->
<div class="space-y-4">
  <app-about></app-about>
  <app-projects></app-projects>
  <app-skills></app-skills>
  <app-contact></app-contact>
</div>
