<section class="flex-grow py-12 sm:py-20 px-4 sm:px-6 lg:px-8 max-w-5xl mx-auto w-full">
  <!-- Section Header -->
  <app-section-header 
    title="Technical Skills" 
    subtitle="An overview of the languages, frameworks, databases, and engineering tools I work with.">
  </app-section-header>

  <!-- Categories Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    @for (category of skillCategories; track category.title) {
      <div class="bg-zinc-900/40 border border-zinc-900 rounded-2xl p-6 sm:p-8 space-y-6">
        <!-- Header -->
        <div class="flex items-center gap-4">
          <div class="h-10 w-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center select-none font-bold">
            {{ category.title.charAt(0) }}
          </div>
          <div>
            <h3 class="text-lg font-bold text-white leading-none mb-1">
              {{ category.title }}
            </h3>
            <p class="text-xs text-zinc-500">
              {{ category.description }}
            </p>
          </div>
        </div>

        <!-- Tags -->
        <div class="flex flex-wrap gap-2">
          @for (skill of category.skills; track skill) {
            <span class="inline-flex items-center px-3 py-1 rounded-lg text-sm bg-zinc-950/80 border border-zinc-800 text-zinc-300 hover:border-indigo-500/30 hover:text-white transition-all duration-200 cursor-default select-none">
              {{ skill }}
            </span>
          }
        </div>
      </div>
    }
  </div>
</section>
