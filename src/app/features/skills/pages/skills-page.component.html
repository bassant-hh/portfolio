<section class="flex-grow py-8 sm:py-16 lg:py-20 px-4 sm:px-6 lg:px-8 max-w-5xl mx-auto w-full">
  <!-- Section Header -->
  <app-section-header
    title="Technical Skills"
    subtitle="An overview of the languages, frameworks, databases, and engineering tools I work with."
  >
  </app-section-header>

  <!-- Categories Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8">
    @for (category of skillCategories; track category.title) {
      <div
        class="bg-white border border-[var(--border-soft)] rounded-2xl p-5 sm:p-8 space-y-5 sm:space-y-6 shadow-sm"
      >
        <!-- Header -->
        <div class="flex items-center gap-3.5 sm:gap-4">
          <div
            class="h-9 sm:h-10 w-9 sm:w-10 rounded-xl bg-[var(--very-light)] text-[var(--primary-deep)] flex items-center justify-center select-none font-bold text-sm sm:text-base shadow-xs flex-shrink-0"
          >
            {{ category.title.charAt(0) }}
          </div>
          <div>
            <h3 class="text-base sm:text-lg font-bold text-[var(--text)] leading-none mb-1">
              {{ category.title }}
            </h3>
            <p class="text-xs text-[var(--text-secondary)]">
              {{ category.description }}
            </p>
          </div>
        </div>

        <!-- Tags -->
        <div class="flex flex-wrap gap-1.5 sm:gap-2">
          @for (skill of category.skills; track skill) {
            <span
              class="inline-flex items-center px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg text-xs sm:text-sm bg-[var(--bg-subtle)] border border-[var(--border-soft)] text-[var(--text)] hover:border-[var(--primary-light)] hover:bg-[var(--very-light)] hover:text-[var(--primary-deep)] font-medium transition-all duration-200 cursor-default select-none"
            >
              {{ skill }}
            </span>
          }
        </div>
      </div>
    }
  </div>
</section>
