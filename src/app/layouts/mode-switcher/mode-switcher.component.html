<div class="switcher-track" role="group" aria-label="View mode">

  <button
    type="button"
    class="switcher-btn"
    [class.switcher-btn-active]="state.uiMode() === 'recruiter'"
    (click)="selectRecruiterMode()"
    [attr.aria-pressed]="state.uiMode() === 'recruiter'"
  >
    Recruiter
  </button>

  <button
    type="button"
    class="switcher-btn"
    [class.switcher-btn-active]="state.uiMode() === 'developer'"
    (click)="selectDeveloperMode()"
    [attr.aria-pressed]="state.uiMode() === 'developer'"
  >
    Developer
  </button>

</div>
