<!-- =========================================================
     BASSANT PORTFOLIO NAVBAR
     ========================================================= -->
<header class="navbar-header">
  <div class="navbar-inner">

    <!-- =====================================================
         Brand / Logo
         ===================================================== -->
    <div class="navbar-brand">
      <a routerLink="/home" class="brand-link" (click)="closeMenu()" aria-label="Bassant Hossny – Home">
        <span class="brand-badge" aria-hidden="true">B</span>
        <span class="brand-name">Bassant Hossny</span>
      </a>
    </div>

    <!-- =====================================================
         Desktop Recruiter Navigation
         ===================================================== -->
    @if (state.uiMode() === 'recruiter') {
      <nav class="desktop-nav" aria-label="Main navigation">
        <a routerLink="/home"     routerLinkActive="nav-link-active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Home</a>
        <a routerLink="/about"    routerLinkActive="nav-link-active" class="nav-link">About</a>
        <a routerLink="/projects" routerLinkActive="nav-link-active" class="nav-link">Projects</a>
        <a routerLink="/skills"   routerLinkActive="nav-link-active" class="nav-link">Skills</a>
        <a routerLink="/contact"  routerLinkActive="nav-link-active" class="nav-link">Contact</a>
      </nav>
    }

    <!-- =====================================================
         Right Side: Mode Switcher + Hamburger
         ===================================================== -->
    <div class="navbar-right">

      <!-- Mode Switcher (always visible) -->
      <app-mode-switcher></app-mode-switcher>

      <!-- Hamburger — only shown in Recruiter mode on mobile -->
      @if (state.uiMode() === 'recruiter') {
        <button
          type="button"
          class="hamburger-btn"
          (click)="toggleMenu()"
          [attr.aria-expanded]="isMenuOpen()"
          aria-controls="mobile-menu"
          aria-label="Toggle navigation menu"
        >
          @if (!isMenuOpen()) {
            <svg class="menu-icon" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
          } @else {
            <svg class="menu-icon" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          }
        </button>
      }
    </div>

  </div>

  <!-- =====================================================
       Mobile Menu (Recruiter mode only)
       ===================================================== -->
  @if (state.uiMode() === 'recruiter' && isMenuOpen()) {
    <nav id="mobile-menu" class="mobile-menu" aria-label="Mobile navigation">
      <a routerLink="/home"     routerLinkActive="mobile-link-active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()" class="mobile-link">Home</a>
      <a routerLink="/about"    routerLinkActive="mobile-link-active" (click)="closeMenu()" class="mobile-link">About</a>
      <a routerLink="/projects" routerLinkActive="mobile-link-active" (click)="closeMenu()" class="mobile-link">Projects</a>
      <a routerLink="/skills"   routerLinkActive="mobile-link-active" (click)="closeMenu()" class="mobile-link">Skills</a>
      <a routerLink="/contact"  routerLinkActive="mobile-link-active" (click)="closeMenu()" class="mobile-link">Contact</a>
    </nav>
  }

</header>
