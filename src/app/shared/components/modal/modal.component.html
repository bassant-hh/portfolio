@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-zinc-950/80 backdrop-blur-sm animate-fade-in">
    <div class="bg-zinc-900 border border-zinc-800 w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl p-6 relative">
      <!-- Header -->
      <div class="flex items-center justify-between pb-4 border-b border-zinc-800 mb-4 select-none">
        <h3 class="text-lg font-bold text-white">{{ title }}</h3>
        <button (click)="onClose()" class="text-zinc-400 hover:text-white transition-colors" type="button">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Body -->
      <div class="text-zinc-300">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
